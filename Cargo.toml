[package]
name = "transaction-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = "1.7"
dotenvy = "0.15.7"
futures = "0.3.31"
log = "0.4.32"
serde = "1.0.228"
serde_json = "1.0.150"
solana-client = "4.2.2"
solana-sdk = "4.0.0"
solana-transaction-status-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-tx-parser = { git = "https://github.com/miaomiaowu0428/solana-tx-parser.git", branch = "main" }
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
grpc-client = { git = "https://github.com/miaomiaowu0428/grpc-client.git", branch = "main" }
# 日志统一走 utils::init_logger（flexi_logger 写在 utils 里）。
# ⚠️ 别再往这儿加 env_logger —— 它会拉 `jiff`，而 jiff 的发布包引用了仓库根目录的
# markdown（`include_str!("../../../../COMPARE.md")`），在 registry 布局下必然编译失败。
flexi_logger = "0.31.8"
whirlwind = { git = "https://github.com/miaomiaowu0428/whirlwind.git" }
transaction-cache = { git = "https://github.com/miaomiaowu0428/transaction-cache.git", branch = "main" }
utils = { git = "https://github.com/miaomiaowu0428/sol-utils.git", branch = "main" }
rustls = "0.23.36"
yellowstone-grpc-proto = "12.7.0"
async-trait = "0.1.89"
arc-swap = "1.8.0"
rand = "0.9.2"
